site_name: 三重県生成AI活用研修 マニュアル
site_description: 公開マニュアル（GitHub Pages）
site_url: https://bazaarjapan.github.io/mie20260113/

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - はじめに: index.md
  - ガイド:
      - 使い始める: guide/getting-started.md
      - 画像の扱い: guide/images.md
      - 公開（GitHub Pages）: guide/publishing.md
  - 資料:
      - 研修カリキュラム: training.md
