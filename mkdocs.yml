site_name: 三重県生成AI活用研修 マニュアル
site_description: 公開マニュアル（GitHub Pages）
site_url: https://bazaarjapan.github.io/mie20260113/

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - はじめに: index.md
  - 資料:
      - 研修カリキュラム: training/index.md
      - 1. 導入・基盤（NotebookLM）: training/01-notebooklm.md
      - 2. リスクと倫理: training/02-risk-ethics.md
      - 3. 実践①（Gemsと最適化ツール）: training/03-gems-automation.md
      - 4. 実践②（Suno AI）: training/04-suno-ai.md
      - 5. 実践③（Nano Banana Pro）: training/05-nano-banana.md
      - 6. 総括・Q&A: training/06-summary-qa.md
      - 7. 発展（Google Antigravity）: training/07-metaphor.md
